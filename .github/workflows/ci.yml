on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

name: CI

env:
  RUSTDOCFLAGS: "-Dwarnings"

jobs:

  versions:
    name: Determine toolchain versions
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.msrv.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Read MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^rust-version/{print $2}' Cargo.toml)
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
        toolchain:
          - "${{ needs.versions.outputs.msrv }}"
          - stable
          - nightly
          - beta
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run cargo build
        run: cargo build --release --target ${{ matrix.target }}

  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        steps:
          - name: cargo check
            run: cargo check --all-targets --all-features
          - name: cargo hack check
            run: cargo hack check --no-private --feature-powerset --no-dev-deps
            hack: true
          - name: cargo hack check --each-feature
            run: cargo hack check --no-private --each-feature --no-dev-deps
            hack: true
          - name: cargo doc
            run: cargo doc --all-features --no-deps
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
        if: matrix.steps.hack
      - name: ${{ matrix.steps.name }}
        run: ${{ matrix.steps.run }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Build cargo tests
        run: cargo test --all-features --no-run

      - name: Run cargo test
        run: cargo test --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-features -- -D warnings
