[package]
name = "hyproxy"
version = "0.13.0"
edition = "2021"
description = "Proxy helpers for hyper services"
license = "MIT"
repository = "https://github.com/alexrudy/hyproxy"
documentation = "https://docs.rs/hyproxy"
rust-version = "1.88"
readme = "README.md"
authors = ["Alex Rudy <opensource@alexrudy.net>"]
categories = ["network-programming", "web-programming::http-server"]
keywords = ["hyper", "http", "server", "async"]


[dependencies]
hyperdriver = { version = "~0.12.8", default-features = false, optional = true }
# Must match the version used by hyperdriver, for `chateau::info::TlsConnectionInfo`.
chateau = { version = "~0.4.2", default-features = false, optional = true }
http = "1"
thiserror = "2"
tracing = "0.1"
tower = "0.5"
tokio = { version = "1", optional = true }
pin-project-lite = "0.2"
nom = "7"
bytes = "1"
hyper = { version = "1", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util", "limit", "timeout"]}
tokio = { version = "1", features = ["macros", "rt"] }
hyper = { version = "1", features = ["client", "server", "http1"] }

[package.metadata.docs.rs]
# Document feature-gated items such as `upgrade` and `ConnectionInfoAdapter`.
all-features = true

[features]
hyperdriver = ["dep:hyperdriver", "dep:chateau"]
upgrade = ["dep:hyper", "tokio/io-util", "tokio/rt"]
